<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Text path for circular arched RESTAURANTE -->
    <path id="textArc" d="M 96 230 A 160 160 0 0 1 416 230" fill="none" />
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Outer Black Circle -->
  <circle cx="256" cy="256" r="250" fill="#0c0c0e" />

  <!-- Outer Bold Orange Ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#ff6b00" stroke-width="20" />

  <!-- Inner Subtle Border -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#1f1f23" stroke-width="4" />

  <!-- Grill Outer Ring Accent -->
  <circle cx="256" cy="210" r="140" fill="none" stroke="#ea580c" stroke-width="12" stroke-dasharray="14 10" opacity="0.85" />

  <!-- Curved Text: RESTAURANTE -->
  <text font-family="'Space Grotesk', 'Impact', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="9">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      RESTAURANTE
    </textPath>
  </text>

  <!-- Left Barbecue Spatula -->
  <g transform="translate(100, 160) rotate(35) scale(0.65)">
    <!-- Spatula Head -->
    <rect x="-24" y="-35" width="48" height="60" rx="10" fill="#ffffff" />
    <line x1="-12" y1="-20" x2="-12" y2="10" stroke="#0c0c0e" stroke-width="5" stroke-linecap="round" />
    <line x1="0" y1="-20" x2="0" y2="10" stroke="#0c0c0e" stroke-width="5" stroke-linecap="round" />
    <line x1="12" y1="-20" x2="12" y2="10" stroke="#0c0c0e" stroke-width="5" stroke-linecap="round" />
    <!-- Handle -->
    <path d="M -6,25 L -6,110 L 6,110 L 6,25 Z" fill="#ffffff" />
  </g>

  <!-- Right Barbecue Fork -->
  <g transform="translate(412, 160) rotate(-35) scale(0.65)">
    <!-- Fork Base & Tines -->
    <path d="M -22,-35 L -22,10 Q -22,25 0,25 Q 22,25 22,10 L 22,-35 L 14,-35 L 14,8 Q 14,16 0,16 Q -14,16 -14,8 L -14,-35 Z" fill="#ffffff" />
    <line x1="0" y1="-30" x2="0" y2="16" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <!-- Handle -->
    <path d="M -6,25 L -6,110 L 6,110 L 6,25 Z" fill="#ffffff" />
  </g>

  <!-- Center Fire Flames -->
  <g transform="translate(256, 215) scale(1.15)">
    <!-- Outer Orange Flame -->
    <path d="M 0,-85 C 20,-50 55,-40 50,0 C 46,30 25,50 0,55 C -25,50 -46,30 -50,0 C -55,-40 -20,-50 0,-85 Z" fill="#ea580c" />
    <!-- Secondary Amber Flame -->
    <path d="M 0,-70 C 15,-40 38,-30 35,5 C 32,25 18,40 0,45 C -18,40 -32,25 -35,5 C -38,-30 -15,-40 0,-70 Z" fill="#f59e0b" />
    <!-- Inner White Hot Flame -->
    <path d="M 0,-50 C 10,-30 24,-20 22,8 C 20,20 12,30 0,34 C -12,30 -20,20 -22,8 C -24,-20 -10,-30 0,-50 Z" fill="#ffffff" filter="url(#flameGlow)" />
  </g>

  <!-- Grill Bowl & Charcoal Embers under Text -->
  <path d="M 120,335 Q 256,430 392,335 C 370,410 290,445 256,445 C 222,445 142,410 120,335 Z" fill="#ff6b00" opacity="0.95" />
  <path d="M 140,345 Q 256,415 372,345 C 350,395 290,425 256,425 C 222,425 162,395 140,345 Z" fill="#18181b" />

  <!-- Embers Glowing in Kettle -->
  <circle cx="220" cy="385" r="7" fill="#ff6b00" />
  <circle cx="256" cy="395" r="9" fill="#f59e0b" />
  <circle cx="292" cy="385" r="7" fill="#ea580c" />
  <circle cx="240" cy="405" r="5" fill="#f59e0b" />
  <circle cx="272" cy="405" r="5" fill="#ff6b00" />

  <!-- Two Horizontal Orange Divider Bars -->
  <rect x="45" y="245" width="422" height="14" rx="7" fill="#ff6b00" />
  <rect x="45" y="322" width="422" height="14" rx="7" fill="#ff6b00" />

  <!-- Central Bold Typography: La Guinea -->
  <text x="256" y="306" font-family="'Space Grotesk', 'Montserrat', 'Arial Black', sans-serif" font-size="76" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
    La Guinea
  </text>
</svg>
